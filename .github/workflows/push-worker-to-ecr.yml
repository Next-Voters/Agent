name: Push Worker Image to ECR

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "docker/Dockerfile.worker"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.WORKER_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.worker -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Update worker Lambda with new image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.WORKER_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          FUNCTION_NAME: ${{ vars.WORKER_FUNCTION_NAME }}
        run: |
          NEW_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$NEW_IMAGE" \
            --publish

          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "Updated $FUNCTION_NAME to $NEW_IMAGE"
