# Mirrors CI (.github/workflows/lint.yml): the ruff hooks use the same pinned
# version (see requirements-dev.txt) and the same rules + format config (from
# pyproject.toml), so a clean pre-commit means a green Lint job. Keep the rev
# here and ruff in requirements-dev.txt on the same version when bumping.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      # Same rules as CI's `ruff check .` (rules come from pyproject.toml).
      # --fix auto-applies fixable violations and fails the commit so they get
      # re-staged; non-fixable ones are reported and block the commit.
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      # Same as CI's `ruff format --check .` (reformats in place and fails on
      # any change, so formatting can't drift past the commit).
      - id: ruff-format

  - repo: local
    hooks:
      - id: compileall
        name: compileall
        entry: python -m compileall -q .
        language: system
        types: [python]
        pass_filenames: false
