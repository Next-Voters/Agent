<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Next Voters Agent</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --queued: #b45309;
      --running: #2563eb;
      --succeeded: #15803d;
      --failed: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .subtitle { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
    .run-form { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    select, button {
      font: inherit;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    select { background: var(--card); color: var(--text); min-width: 200px; }
    button {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { font-size: 0.9rem; color: var(--muted); min-height: 1.2em; margin-top: 0.5rem; }
    .message.error { color: var(--failed); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--bg); }
    .status {
      display: inline-block;
      padding: 0.1rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
    }
    .status.queued { background: var(--queued); }
    .status.running { background: var(--running); }
    .status.succeeded { background: var(--succeeded); }
    .status.failed { background: var(--failed); }
    .empty { color: var(--muted); font-size: 0.92rem; padding: 0.5rem 0; }
    .topic { margin-bottom: 1.5rem; }
    .topic h3 { font-size: 1rem; margin: 0 0 0.25rem; text-transform: capitalize; }
    .topic .desc { color: var(--muted); font-size: 0.88rem; margin: 0 0 0.6rem; }
    .item { border-left: 3px solid var(--accent); padding: 0.2rem 0 0.2rem 0.75rem; margin-bottom: 0.9rem; }
    .item h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .item ul { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; }
    .sources { font-size: 0.85rem; margin-top: 0.5rem; }
    .sources a { color: var(--accent); word-break: break-all; }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--failed);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Next Voters Agent</h1>
    <p class="subtitle">Research municipal legislation for a region and browse the results.</p>

    <section class="card">
      <h2>Start a run</h2>
      <div class="run-form">
        <select id="region-select" disabled>
          <option>Loading regions…</option>
        </select>
        <button id="run-button" disabled>Run pipeline</button>
      </div>
      <p id="form-message" class="message"></p>
    </section>

    <section class="card">
      <h2>Runs</h2>
      <div id="runs-container"><p class="empty">No runs yet.</p></div>
    </section>

    <section class="card" id="detail-card" hidden>
      <h2 id="detail-title">Run detail</h2>
      <div id="detail-body"></div>
    </section>
  </main>

  <script>
    const regionSelect = document.getElementById("region-select");
    const runButton = document.getElementById("run-button");
    const formMessage = document.getElementById("form-message");
    const runsContainer = document.getElementById("runs-container");
    const detailCard = document.getElementById("detail-card");
    const detailTitle = document.getElementById("detail-title");
    const detailBody = document.getElementById("detail-body");

    let selectedRunId = null;

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function fmtTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString();
    }

    async function loadRegions() {
      try {
        const res = await fetch("/api/regions");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        regionSelect.innerHTML = data.regions
          .map((r) => `<option value="${esc(r)}">${esc(r)}</option>`)
          .join("");
        regionSelect.disabled = false;
        runButton.disabled = false;
      } catch (err) {
        formMessage.textContent = `Failed to load regions: ${err.message}`;
        formMessage.className = "message error";
      }
    }

    async function startRun() {
      const region = regionSelect.value;
      runButton.disabled = true;
      formMessage.textContent = "";
      formMessage.className = "message";
      try {
        const res = await fetch("/api/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ region }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
        formMessage.textContent = `Run started for ${region}.`;
        selectedRunId = data.id;
        await refreshRuns();
        await refreshDetail();
      } catch (err) {
        formMessage.textContent = err.message;
        formMessage.className = "message error";
      } finally {
        runButton.disabled = false;
      }
    }

    function renderRunsTable(runs) {
      if (!runs.length) {
        runsContainer.innerHTML = '<p class="empty">No runs yet.</p>';
        return;
      }
      const rows = runs
        .map(
          (r) => `
        <tr data-id="${esc(r.id)}">
          <td>${esc(r.region)}</td>
          <td><span class="status ${esc(r.status)}">${esc(r.status)}</span></td>
          <td>${fmtTime(r.created_at)}</td>
          <td>${fmtTime(r.finished_at)}</td>
        </tr>`
        )
        .join("");
      runsContainer.innerHTML = `
        <table>
          <thead><tr><th>Region</th><th>Status</th><th>Created</th><th>Finished</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      runsContainer.querySelectorAll("tbody tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          selectedRunId = tr.dataset.id;
          refreshDetail();
        });
      });
    }

    async function refreshRuns() {
      try {
        const res = await fetch("/api/runs");
        if (!res.ok) return;
        const data = await res.json();
        renderRunsTable(data.runs);
      } catch {
        /* transient network error — retry on next poll */
      }
    }

    function renderResult(result) {
      const topics = Object.entries(result || {});
      if (!topics.length) return '<p class="empty">No topic results.</p>';
      return topics
        .map(([topic, data]) => {
          const items = (data.legislation_summary?.items || [])
            .map(
              (item) => `
            <div class="item">
              <h4>${esc(item.header)}</h4>
              <ul>${(item.bullets || []).map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
            </div>`
            )
            .join("");
          const sources = (data.legislation_sources || [])
            .map((s) => (typeof s === "string" ? s : s.url))
            .filter(Boolean)
            .map((u) => `<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`)
            .join("");
          return `
          <div class="topic">
            <h3>${esc(topic)}</h3>
            ${data.topic_description ? `<p class="desc">${esc(data.topic_description)}</p>` : ""}
            ${items || '<p class="empty">No legislation items found.</p>'}
            ${sources ? `<div class="sources"><strong>Sources</strong>${sources}</div>` : ""}
          </div>`;
        })
        .join("");
    }

    async function refreshDetail() {
      if (!selectedRunId) return;
      try {
        const res = await fetch(`/api/runs/${selectedRunId}`);
        if (!res.ok) return;
        const run = await res.json();
        detailCard.hidden = false;
        detailTitle.textContent = `Run ${run.id} — ${run.region}`;
        let html = `
          <p class="meta">
            <span class="status ${esc(run.status)}">${esc(run.status)}</span>
            &nbsp; Created ${fmtTime(run.created_at)} · Started ${fmtTime(run.started_at)} · Finished ${fmtTime(run.finished_at)}
            ${run.report_id != null ? ` · Report #${esc(run.report_id)}` : ""}
          </p>`;
        if (run.error) html += `<div class="error-box">Pipeline error: ${esc(run.error)}</div>`;
        if (run.failures?.length) {
          html += `<div class="error-box">Failed to save: ${run.failures.map(esc).join(", ")}</div>`;
        }
        if (run.result) {
          html += renderResult(run.result);
        } else if (run.status === "queued" || run.status === "running") {
          html += '<p class="empty">Results will appear here when the run finishes.</p>';
        }
        detailBody.innerHTML = html;
      } catch {
        /* transient network error — retry on next poll */
      }
    }

    runButton.addEventListener("click", startRun);
    loadRegions();
    refreshRuns();
    setInterval(() => {
      refreshRuns();
      refreshDetail();
    }, 5000);
  </script>
</body>
</html>
